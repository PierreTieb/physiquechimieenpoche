<svg xmlns="http://www.w3.org/2000/svg" width="480" height="240" viewBox="0 0 480 240">
  <!-- Tableau blanc : traces d'effaçage, écritures au feutre à moitié effacées, symboles -->
  <defs>
    <filter id="flou" x="-20%" y="-50%" width="140%" height="200%"><feGaussianBlur stdDeviation="3"/></filter>
    <filter id="feutre"><feGaussianBlur stdDeviation=".35"/></filter>
  </defs>
  <!-- Traces grises laissées par l'effaceur -->
  <g fill="none" stroke="#7D8A9C" stroke-linecap="round" filter="url(#flou)">
    <path d="M30 70q60-22 120-4t130-8" stroke-width="20" stroke-opacity="0.10"/>
    <path d="M250 150q50 18 110 0t110 10" stroke-width="24" stroke-opacity="0.08"/>
    <path d="M60 190l40-30 30 26 40-34 34 30" stroke-width="10" stroke-opacity="0.10"/>
    <path d="M330 40q30 12 60-4t70 6" stroke-width="14" stroke-opacity="0.11"/>
  </g>
  <!-- Écritures fantômes, presque effacées -->
  <g font-family="'Ink Free','Segoe Print','Bradley Hand','Noteworthy','Chalkboard SE','Comic Sans MS',cursive" font-size="20" fill="#5E6B80" fill-opacity="0.18" filter="url(#feutre)">
    <text x="150" y="118" transform="rotate(-4 150 118)">10⁻³ m</text>
    <text x="300" y="104">1 L = 1 dm³</text>
    <text x="20" y="236" font-size="16">÷ 60</text>
  </g>
  <g fill="none" stroke="#5E6B80" stroke-opacity="0.17" stroke-width="2.4" stroke-linecap="round">
    <path d="M196 182q20 16 46 0"/><path d="M402 210l18-18m-8 0h8v8"/>
  </g>
  <!-- Écritures au feutre -->
  <g font-family="'Ink Free','Segoe Print','Bradley Hand','Noteworthy','Chalkboard SE','Comic Sans MS',cursive" font-size="21" filter="url(#feutre)">
    <text x="18" y="34" fill="#2463C9" fill-opacity="0.77" transform="rotate(-3 18 34)">1 km = 1000 m</text>
    <text x="348" y="30" fill="#2F9E5A" fill-opacity="0.77">m³ → L</text>
    <text x="408" y="128" fill="#D9473D" fill-opacity="0.77" transform="rotate(6 408 128)">÷ 3,6</text>
    <text x="16" y="138" fill="#2B2F36" fill-opacity="0.59" font-size="28">π</text>
    <text x="440" y="74" fill="#2B2F36" fill-opacity="0.56" font-size="26">√</text>
    <text x="232" y="230" fill="#2463C9" fill-opacity="0.70">km/h</text>
    <text x="318" y="226" fill="#2F9E5A" fill-opacity="0.70" font-size="19" transform="rotate(-3 318 226)">1 h = 3600 s</text>
    <text x="196" y="40" fill="#D9473D" fill-opacity="0.63" font-size="24">≈</text>
    <text x="64" y="104" fill="#2F9E5A" fill-opacity="0.59" font-size="24">Σ</text>
    <text x="252" y="76" fill="#2B2F36" fill-opacity="0.49" font-size="22">%</text>
  </g>
  <!-- Mini tableau de conversion, avec ses sauts « ×10 » -->
  <g transform="translate(22 160) rotate(-2)" filter="url(#feutre)">
    <g fill="none" stroke="#2B2F36" stroke-opacity="0.53" stroke-width="2" stroke-linecap="round">
      <path d="M0 20h168M42 0v34M84 0v34M126 0v34"/>
    </g>
    <g font-family="'Ink Free','Segoe Print','Bradley Hand','Noteworthy','Chalkboard SE','Comic Sans MS',cursive" font-size="16" fill="#2B2F36" fill-opacity="0.63" text-anchor="middle">
      <text x="21" y="15">kg</text><text x="63" y="15">hg</text><text x="105" y="15">dag</text><text x="147" y="15">g</text>
    </g>
    <g fill="none" stroke="#D9473D" stroke-opacity="0.70" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M22 40q20 16 40 0m-7-1 7 1-1 7"/><path d="M64 40q20 16 40 0m-7-1 7 1-1 7"/><path d="M106 40q20 16 40 0m-7-1 7 1-1 7"/>
    </g>
    <text x="84" y="72" font-family="'Ink Free','Segoe Print','Bradley Hand','Noteworthy','Chalkboard SE','Comic Sans MS',cursive" font-size="15" fill="#D9473D" fill-opacity="0.70" text-anchor="middle">× 10</text>
  </g>
  <!-- Flèches, entourage, soulignement -->
  <g fill="none" stroke-linecap="round" stroke-linejoin="round" stroke-width="2.2" filter="url(#feutre)">
    <path d="M20 42q70 6 136-2" stroke="#2463C9" stroke-opacity="0.56"/>
    <ellipse cx="428" cy="120" rx="38" ry="20" transform="rotate(6 428 120)" stroke="#D9473D" stroke-opacity="0.49"/>
    <path d="M300 30q20-16 40-6m-8-6 8 6-8 5" stroke="#2F9E5A" stroke-opacity="0.56"/>
    <path d="M282 216q14-10 28 0" stroke="#2463C9" stroke-opacity="0.49"/>
  </g>
</svg>
